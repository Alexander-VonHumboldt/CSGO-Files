// Alexander Von Humboldt's Dope Ass CS2 Autoexec

cl_showfps 0

// Console Command Shortcuts
alias d "disconnect"
alias s "status"
alias exit "quit"

alias cfg "exec autoexec_cs2.cfg; echo --cfg reloaded--"
bind "KP_DIVIDE" "cfg"

// Default sensitivity
sensitivity "0.66"

// Bind sensitivity adjustment (+-0.1) to PgUP and PgDN
// Smaller adjustments (+-0.01) to home and end
alias "incSens" "incrementvar sensitivity 0.010000 3.000000 +0.1; sensitivity"
alias "decSens" "incrementvar sensitivity 0.010000 3.000000 -0.1; sensitivity"
alias "incSensMicro" "incrementvar sensitivity 0.010000 3.000000 +0.01; sensitivity"
alias "decSensMicro" "incrementvar sensitivity 0.010000 3.000000 -0.01; sensitivity"
bind "PGUP" "incSens"
bind "PGDN" "decSens"
bind "HOME" "incSensMicro"
bind "END" "decSensMicro"

// Community Server Alias
alias puff "connect cs2.puff.ac" //CS2 casual server
alias zaps "connect onlyzaps.gg" //Only Zaps casual
alias zapsalt "connect 40.160.19.120:27015" //Only Zaps IP Connect
alias zapstv "connect 135.148.136.190:27015" //Only Zaps GOTV
alias skn "connect scoutsknives.club"

// VOIP volume
// Increment / Decrement
alias "incVol" "incrementvar snd_voipvolume 0.1 2.0 +0.1; snd_voipvolume"
alias "decVol" "incrementvar snd_voipvolume 0.1 2.0 -0.1; snd_voipvolume"
bind "]" "incVol"
bind "[" "decVol"
// Default
snd_voipvolume 1.4

// Text Binds
bind "KP_1" "say Go hang a salami"
bind "KP_2" "say Im a lasagna hog"
bind "KP_3" "say RAT ALART"
bind "KP_4" "say Hey mate, what controller are you using?"
bind "KP_5" "say I am playing with my feet"
bind "KP_6" "say Want to smell my keyboard?"
bind "KP_7" "trashtalker"
bind "KP_8" "say God Luck and Good Speed!"
bind "KP_9" "say ?????"

// Video
fps_max "400"

// Viewmodel
viewmodel_fov "68"
viewmodel_offset_x "2"
viewmodel_offset_y "1"
viewmodel_offset_z "-1"

// Audio
volume "1"
snd_mapobjective_volume "0.2"
snd_musicvolume "0.2"
snd_mute_losefocus "0"
snd_roundend_volume "0.2"
snd_roundstart_volume "0.2"
snd_tensecondwarning_volume "0.4"

// Radar (keep: not centered, rotating)
cl_radar_always_centered "0"          // NEVER change
cl_radar_rotate "1"                   // NEVER change
cl_radar_icon_scale_min "1"
cl_radar_square_with_scoreboard "1"

// Default radar zoom
cl_radar_scale "0.3"

// Radar size (HUD footprint)
bind "KP_MULTIPLY" "incrementvar cl_hud_radar_scale 0.8 2.0 0.2"

// Radar zoom controls (cl_radar_scale only)
// KP_MINUS zooms OUT (bigger number = more zoomed out, more map shown)
// KP_PLUS  zooms IN  (smaller number = more zoomed in, less map shown)
bind "KP_MINUS" "incrementvar cl_radar_scale 0.1 0.9 +0.1; cl_radar_scale"
bind "KP_PLUS"  "incrementvar cl_radar_scale 0.1 0.9 -0.1; cl_radar_scale"

// execute trashtalker config
exec trashtalker.cfg

echo "--trashtalker loaded--"

echo "------------------"
echo "-autoexec_cs2.cfg-"
echo "----2026-03-09----"
echo "--config loaded---"
echo "------------------"